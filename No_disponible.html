<style>
  :root {
    --canvas-bg: #09090b;
    --card-surface: rgba(20, 20, 23, 0.6);
    --card-border: rgba(255, 255, 255, 0.06);
    --text-main: #f4f4f5;
    --text-muted: #a1a1aa;
    --brand-start: #ff7e5f;
    --brand-end: #feb47b;
    --brand-neon: #ffffff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
}

body {
    background-color: var(--canvas-bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
    overflow: hidden;
}

/* Fondo Líquido Estilo Stripe/Apple */
.liquid-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    background: radial-gradient(circle at 80% 20%, rgba(124, 58, 237, 0.15), transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(236, 72, 153, 0.12), transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.08), transparent 60%);
    filter: blur(40px);
}

/* Contenedor Estilo Aero-Luxury */
.luxury-container {
    background: var(--card-surface);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    width: 100%;
    max-width: 480px;
    border-radius: 28px;
    padding: 3rem 2.25rem 2.5rem 2.25rem;
    box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
    z-index: 10;
    animation: fadeInContainer 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Indicador con Pulso Real */
.status-pulse-wrapper {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 0.4rem 0.9rem;
    border-radius: 100px;
    margin-bottom: 2rem;
}

.pulse-dot {
    width: 6px;
    height: 6px;
    background-color: #f59e0b;
    border-radius: 50%;
    position: relative;
}

.pulse-dot::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    background-color: inherit;
    border-radius: 50%;
    animation: luxuryPulse 2s infinite ease-in-out;
}

.pulse-text {
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: #f59e0b;
}

/* Tipografía de Alta Gama */
.luxury-title {
    font-size: 2.25rem;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
}

.gradient-text {
    background: linear-gradient(90deg, #fff, var(--text-muted));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.luxury-subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 2.5rem;
}


/* Footer */
.luxury-footer {
    margin-top: 3rem;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.8rem;
}

.nav-luxury-link {
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s ease;
}

.nav-luxury-link:hover {
    color: var(--text-main);
}

.system-status {
    color: rgba(255, 255, 255, 0.4);
}

.dot-separator {
    color: rgba(255, 255, 255, 0.1);
}

/* Keyframes de Animaciones */
@keyframes luxuryPulse {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(3); opacity: 0; }
}

@keyframes fadeInContainer {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}
