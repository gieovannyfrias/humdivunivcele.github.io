<style>
  :root {
    --bg-color: #0f172a;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent-color: #3b82f6;
    --accent-hover: #2563eb;
}

* {
 
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: var(--bg-color);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;

  zoom:75%;

.error-container {
    text-align: center;
    max-width: 600px;
    padding: 2rem;
    z-index: 10;
}

.error-code {
    font-size: clamp(8rem, 15vw, 12rem);
    font-weight: 900;
    line-height: 1;
    color: var(--text-primary);
    letter-spacing: -0.05em;
    text-shadow: 0 0 0px rgba(59, 130, 246, 0);
    transition: text-shadow 0.1s ease;
    animation: float 4s ease-in-out infinite;
}

.error-heading {
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    margin-top: 1rem;
    color: var(--text-primary);
}

.error-message {
    color: var(--text-secondary);
    font-size: 1.1rem;
    margin-top: 1rem;
    line-height: 1.6;
}

.redirect-box {
    margin-top: 2rem;
    font-size: 0.95rem;
    color: var(--text-secondary);
}

#countdown {
    color: var(--accent-color);
    font-weight: bold;
}

.home-btn {
    display: inline-block;
    margin-top: 2rem;
    padding: 0.75rem 2rem;
    background-color: var(--accent-color);
    color: white;
    text-decoration: none;
    font-weight: 600;
    border-radius: 50px;
    transition: background-color 0.3s ease, transform 0.2s ease;
}

.home-btn:hover {
    background-color: var(--accent-hover);
    transform: translateY(-2px);
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

  </style>
    <script>
  // Interactive Mouse Glowing Shadow Effect
const errorCode = document.getElementById('errorCode');

document.addEventListener('mousemove', (e) => {
    const x = e.clientX;
    const y = e.clientY;
    
    // Get center coordinates of the 404 text
    const rect = errorCode.getBoundingClientRect();
    const textX = rect.left + rect.width / 2;
    const textY = rect.top + rect.height / 2;
    
    // Calculate angle and distance between cursor and 404 text
    const angleX = (textX - x) / 15;
    const angleY = (textY - y) / 15;
    
    // Update text shadow to simulate light source direction
    errorCode.style.textShadow = `${angleX}px ${angleY}px 20px rgba(59, 130, 246, 0.6)`;
});

// Automatic Countdown Redirect
let timeLeft = 10;
const countdownElement = document.getElementById('countdown');

const downloadTimer = setInterval(() => {
    timeLeft--;
    countdownElement.textContent = timeLeft;
    
    if (timeLeft <= 0) {
        clearInterval(downloadTimer);
        window.location.href = "/"; // Target redirect URL (e.g., homepage)
    }
}, 1000);

  </script>
