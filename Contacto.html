<body>
<div class="section_0">
    <!-- CONTENEDOR PRINCIPAL -->
    <main class="contact-wrapper">
        <div class="contact-header">
            <h1>Ponte en Contacto</h1>
            <p>¿Tienes dudas sobre nosotros o quieres colaborar? Escríbenos.</p>
        </div>

        <!-- Formulario procesado por prevención nativa para pruebas locales -->
       <form class="contact-form" action="https://formspree.io/f/maeybkvj" method="POST"> 
  
  <div class="form-group"> 
    <label for="name">Nombre Completo</label> 
    <!-- Se añadió name="name" -->
    <input type="text" id="name" name="name" class="form-control" placeholder="Ej. John Doe" required> 
  </div> 

  <div class="form-group"> 
    <label for="email">Correo Electrónico</label> 
    <!-- Se añadió name="email" -->
    <input type="email" id="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required> 
  </div> 

  <div class="form-group"> 
    <label for="subject">Asunto</label> 
    <!-- Se añadió name="subject" -->
    <input type="text" id="subject" name="subject" class="form-control" placeholder="Motivo de tu mensaje" required> 
  </div> 

  <div class="form-group"> 
    <label for="message">Mensaje</label> 
    <!-- Se añadió name="message" -->
    <textarea id="message" name="message" class="form-control" placeholder="Escribe los detalles aquí..." required></textarea> 
  </div> 

  <button type="submit" class="btn-submit">Enviar Mensaje</button> 

</form>

    </main>
  </div>
    <style>
        /* ==========================================================================
           1. ESTILOS BASE (Sincronizados con tu proyecto global)
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
      body{
                    background: #2b2a2b; /* El mismo fondo oscuro de la rueda */

      }
        .section_0 {
            color: white;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 6rem 2rem 8rem 2rem; /* Espaciado para que el Header y Footer fixed no tapen el contenido */
        }

        /* Imagen de fondo sutil difuminada para la página de contacto */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('https://picsum.photos');
            background-size: cover;
            background-position: center;
            opacity: 0.15; /* Súper tenue para no perder legibilidad */
            z-index: -1;
            filter: blur(5px);
        }

        /* ==========================================================================
           2. CONTENEDOR PREMIUM DE CONTACTO (GLASSMORPHISM)
           ========================================================================== */
        .contact-wrapper {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 3rem;
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s cubic-bezier(0.25, 1, 0.5, 1) ease-out;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .contact-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .contact-header p {
            font-family: 'Karla', sans-serif;
            color: #888;
            font-size: 0.95rem;
        }

        /* ==========================================================================
           3. FORMULARIO E INPUTS PREMIUM
           ========================================================================== */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-control {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: white;
            font-family: 'Karla', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: steelblue; /* Sincronizado con las líneas de tu carrusel */
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 10px rgba(70, 130, 180, 0.15);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        /* Botón de envío estilizado */
        .btn-submit {
            background: steelblue;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            margin-top: 0.5rem;
            transition: all 0.25s ease;
        }

        .btn-submit:hover {
            background: #3572a5; /* Tono de acero ligeramente más oscuro */
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(70, 130, 180, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Animación suave de entrada de la página */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==========================================================================
           4. ADAPTACIÓN RESPONSIVA (MÓVILES)
           ========================================================================== */
        @media (max-width: 600px) {
            body {
                padding: 6rem 1rem 4rem 1rem;
            }
            .contact-wrapper {
                padding: 1.75rem;
            }
            .contact-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
    <!-- INYECCIÓN AUTOMÁTICA DEL HEADER Y FOOTER PREMIUM
         Al estar guardado tu menú y estilos en este script, la página se maquetará sola al cargar -->
